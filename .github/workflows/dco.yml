name: dco

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Signed-off-by trailers
        run: >-
          python scripts/check_dco.py
          --base "${{ github.event.pull_request.base.sha }}"
