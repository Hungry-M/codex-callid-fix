name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller sv-ttk

      - name: Test rewrite logic
        run: node --test

      - name: Build GUI and installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1

      - name: Sign release binaries (optional)
        if: ${{ env.CODESIGN_PFX_BASE64 != '' }}
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File packaging/sign.ps1 -PfxPath $pfx -PfxPassword $env:CODESIGN_PFX_PASSWORD
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexCallIdFix-windows
          path: |
            dist/CodexCallIdFix.exe
            dist/CodexCallIdFix-Setup-0.1.1.exe
            dist/CodexCallIdFix-0.1.1-portable.zip
            dist/SHA256SUMS.txt
            README.md
            LICENSE
            AUTHORS.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexCallIdFix.exe
            dist/CodexCallIdFix-Setup-0.1.1.exe
            dist/CodexCallIdFix-0.1.1-portable.zip
            dist/SHA256SUMS.txt
            README.md
            LICENSE
            AUTHORS.md
          generate_release_notes: true
